[project]
name = "delve"
dynamic = ["version"]
description = "Delve: a tabletop RPG table with Claude as the DM, and its maps and modules."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic>=2.7",
    "lark>=1.2.2",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "markdown-it-py>=3.0",
    "mcp>=1.27,<2",
    "pdfplumber==0.11.10",
    "pytesseract==0.3.13",
    "pillow==13.0.0",
    "numpy==2.5.4",
    "resvg-py==0.5.0",
    "pyjwt[crypto]>=2.8",
]

[project.scripts]
delve = "delve.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "import-linter",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/delve/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/delve"]
# The Vite build output is gitignored but belongs in the wheel.
artifacts = ["src/delve/web/static/**"]

# The house rules seeded on first start (ttrpg2's global/house-rules), from the top of the repository.
[tool.hatch.build.targets.wheel.force-include]
"reference/house-rules" = "delve/reference/house-rules"
# The app's Help topics, which Ask the DM reads for a question about Delve itself (DEL-221).
"web/src/help/topics" = "delve/help/topics"
# The web dictionaries, whose `email.*` words the server composes email from (DEL-314).
"web/src/i18n" = "delve/i18n/web"

[tool.ruff]
line-length = 120
target-version = "py312"
# Ported from dungml (a66a1bb) and kept as it is there: not reformatted to Delve's lint rules.
extend-exclude = ["src/delve/maps/dsl", "src/delve/modules/dscn", "tests/maps/dsl", "tests/modules/dscn"]

[tool.pytest.ini_options]
testpaths = ["tests", "packs/osric/tests"]
# `make ci` runs every test; `-m "not slow"` skips the slow ones for a quick run.
markers = ["slow: takes seconds, such as building reference.db from the committed snapshots"]
# A whole run writes gigabytes under /tmp (often memory): keep only a failed test's directory, not every test's.
tmp_path_retention_policy = "failed"

# Dependencies point inward (spec §5.1). The SQL and HTTP rules forbid direct imports only: `delve.web` may use
# `delve.storage`, which uses SQLAlchemy, but may not import SQLAlchemy itself.
[tool.importlinter]
root_package = "delve"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only delve.storage imports sqlalchemy or alembic"
type = "forbidden"
source_modules = [
    "delve.__main__",
    "delve.config",
    "delve.domain",
    "delve.rules",
    "delve.dice",
    "delve.setting",
    "delve.maps",
    "delve.modules",
    "delve.play",
    "delve.dm",
    "delve.images",
    "delve.i18n",
    "delve.web",
    "delve.conversions",
    "delve.novels",
    "delve.histories",
    "delve.cloud",
    "delve.mail",
]
forbidden_modules = ["sqlalchemy", "alembic"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only delve.web imports fastapi, starlette or uvicorn"
type = "forbidden"
source_modules = [
    "delve.__main__",
    "delve.config",
    "delve.domain",
    "delve.storage",
    "delve.rules",
    "delve.dice",
    "delve.setting",
    "delve.maps",
    "delve.modules",
    "delve.play",
    "delve.dm",
    "delve.images",
    "delve.i18n",
    "delve.conversions",
    "delve.novels",
    "delve.histories",
    "delve.cloud",
    "delve.mail",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "delve.domain imports no other delve package"
type = "forbidden"
source_modules = ["delve.domain"]
forbidden_modules = [
    "delve.conversions",
    "delve.novels",
    "delve.histories",
    "delve.storage",
    "delve.rules",
    "delve.dice",
    "delve.setting",
    "delve.maps",
    "delve.modules",
    "delve.play",
    "delve.dm",
    "delve.images",
    "delve.i18n",
    "delve.web",
]

[[tool.importlinter.contracts]]
name = "Rules, setting, maps and modules know nothing of HTTP, the DM, SQL or play"
type = "forbidden"
source_modules = ["delve.rules", "delve.dice", "delve.setting", "delve.maps", "delve.modules"]
forbidden_modules = ["delve.web", "delve.dm", "delve.storage", "delve.play"]

# Packs (DEL-307) load rulesets and settings; they know nothing of HTTP, the DM, SQL or play. The catalogs alone open
# `reference.db` for the in-tree rulesets and settings that still read it.
[[tool.importlinter.contracts]]
name = "delve.packs imports none of delve.web, delve.dm, delve.storage or delve.play"
type = "forbidden"
source_modules = ["delve.packs"]
forbidden_modules = ["delve.web", "delve.dm", "delve.storage", "delve.play"]

# Books (plateau 5) are pure: every Claude step is an injected `complete`, and `delve.conversions` runs them.
[[tool.importlinter.contracts]]
name = "delve.modules.books knows nothing of HTTP, the DM, SQL, play or the conversions"
type = "forbidden"
source_modules = ["delve.modules.books"]
forbidden_modules = ["delve.web", "delve.dm", "delve.storage", "delve.play", "delve.conversions"]

# Conversions (plateau 5) run the books' work with the DM provider and storage; they know nothing of HTTP or play.
[[tool.importlinter.contracts]]
name = "delve.conversions imports none of delve.web or delve.play"
type = "forbidden"
source_modules = ["delve.conversions"]
forbidden_modules = ["delve.web", "delve.play"]

# Novels (novelization) read play data and run as conversion jobs; only the API and the CLI reach them.
[[tool.importlinter.contracts]]
name = "Nothing but delve.web and delve.__main__ imports delve.novels"
type = "forbidden"
source_modules = [
    "delve.config",
    "delve.domain",
    "delve.storage",
    "delve.rules",
    "delve.dice",
    "delve.setting",
    "delve.maps",
    "delve.modules",
    "delve.play",
    "delve.dm",
    "delve.images",
    "delve.i18n",
    "delve.conversions",
]
forbidden_modules = ["delve.novels"]

# Histories (carry the party on) read play data through the novels' material and run as conversion jobs, as novels do.
[[tool.importlinter.contracts]]
name = "Nothing but delve.web and delve.__main__ imports delve.histories"
type = "forbidden"
source_modules = [
    "delve.config",
    "delve.domain",
    "delve.storage",
    "delve.rules",
    "delve.dice",
    "delve.setting",
    "delve.maps",
    "delve.modules",
    "delve.play",
    "delve.dm",
    "delve.images",
    "delve.i18n",
    "delve.conversions",
    "delve.novels",
]
forbidden_modules = ["delve.histories"]

[[tool.importlinter.contracts]]
name = "delve.maps does not import delve.modules"
type = "forbidden"
source_modules = ["delve.maps"]
forbidden_modules = ["delve.modules"]

# The MCP SDK serves the DM's tools to `claude -p` through `delve dm-bridge`, and is used nowhere else.
[[tool.importlinter.contracts]]
name = "Only delve.dm.bridge imports mcp"
type = "forbidden"
source_modules = ["delve"]
forbidden_modules = ["mcp"]
ignore_imports = ["delve.dm.bridge -> mcp"]
allow_indirect_imports = true
