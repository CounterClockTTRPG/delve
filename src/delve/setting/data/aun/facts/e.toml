[[fact]]
text = "In Sunward law an oath only binds if it is sworn at noon, out of doors, with the right hand held flat to the sun. Sworn after dark, it is merely a promise."
category = "gods"

[[fact]]
text = "Priests of Velis bury everyone, enemies and heretics included, and both armies of the Seven Years' War let them cross the battle line under a grey veil."
category = "gods"

[[fact]]
text = "Karsk's red open hand means both the blow and the surrender. A soldier who kills a man after his hand is up is outcast in every Free Company that hears of it."
category = "customs"

[[fact]]
text = "Sailors throw an iron hook into the sea before a voyage, so that Marrah has something to hold that isn't the ship."
category = "customs"

[[fact]]
text = "At Harvest Home the first loaf of the new grain goes to Hollin, and the second to whatever small god the village keeps. Nobody pretends otherwise."
category = "customs"

[[fact]]
text = "At Sere's temples the offering is a secret, whispered through a wooden lattice into a closed box that nobody is supposed to open."
category = "gods"

[[fact]]
text = "Before a deal, Haskers spin a coin on the table for Fennick. Nobody cares how it falls; the spin is the prayer, and a merchant who won't spin is planning to cheat."
category = "customs"

[[fact]]
text = "A promise of marriage made on Isaine's Morning may be broken without shame until the end of the month of Isaine. After that, it holds."
category = "customs"

[[fact]]
text = "Complaining of the cold in front of a shrine of Vorm is an offence. Hold-folk children learn to say \"It is a fine day\" through chattering teeth."
category = "customs"

[[fact]]
text = "On 1 Ashen every forge is brought back to full heat, and the first thing made is a single nail for Asheth's temple. The temples have barrels of them."
category = "gods"

[[fact]]
text = "If you dream something terrible, pour the bowl of water by your bed out of the window before you speak. Telling a bad dream at breakfast makes it come true."
category = "customs"

[[fact]]
text = "Hask's sewer grates are made with bars across them, so that no drain in the city looks like an open mouth."
category = "places"

[[fact]]
text = "The Hill That Listens answers one question a year. The price is a secret you have never told anyone, and must never tell again."
category = "gods"

[[fact]]
text = "Pirates of the Drowned Coast carry no bells aboard. Any ship's bell they capture is thrown to the Drowned Bell."
category = "customs"

[[fact]]
text = "A glass cairn with a cup at its foot marks where the Glass Saint led someone to water. A cairn without a cup marks where it led someone to die."
category = "places"

[[fact]]
text = "The Hold-folk lay their dead on Grandmother Frost's glacier. On a clear day you can see them in the ice, in rows, in their best clothes."
category = "places"

[[fact]]
text = "Dwarves keep grudge-books. King Barrek Stonesong's grudge against the Margrave over the eastern mines fills three pages."
category = "people"

[[fact]]
text = "Riverfolk weddings are held on two boats lashed together in midstream. If the knot comes loose during the feast, the marriage is off."
category = "people"

[[fact]]
text = "Gnomes keep the path to the Hill That Listens and cut its chalk ear fresh each spring. They are paid in secrets."
category = "people"

[[fact]]
text = "Since 1187, Oruun's seers in different cities have been dreaming of a lantern that burns black, and drawing it the same way."
category = "gods"
dm_only = true
