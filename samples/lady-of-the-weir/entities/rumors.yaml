- id: three-vanished
  text: Three folk vanished on the river path since the new moon, at night, a night apart - Coll the miller's boy, Annet the tinker's wife and old Brisk the drover.
  truth: "true"
  audience: player
- id: wenna-sings
  text: The Reeve's girl Wenna goes down to the pool at dusk and sings to it.
  truth: "true"
  audience: player
