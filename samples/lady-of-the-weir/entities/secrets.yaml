- id: reeve-broke-the-stone
  text: Reeve Haldan broke the Lady's offering-stone with a mason's maul on the night of the new moon, so that she could not take Wenna. That weakened the Lady and fouled her pool.
  related: [npc:reeve-haldan, npc:the-lady, npc:wenna]
- id: the-consort
  text: Every fifty years the Lady takes a mortal consort, who lives on in the pool, alive but no longer human, seen at dusk in the reeds, never coming home. Sorrel was the last; he left her after twenty years and died on the bank. This spring she chose Wenna.
  related: [npc:the-lady, npc:wenna, npc:sorrel]
- id: odo-pried-the-blade
  text: Odo's men pried a bronze sword out of the seal in the Sluice-House a week ago, on Odo's order, and fled when the floor "breathed". The blade was the Lady's, pinning Ostric under his floor; drawing it woke him.
  related: [npc:odo-tesk, npc:garm-and-totty, npc:ostric]
- id: the-warden
  text: The walking dead are the Sluice-Warden, Ostric, a Thaumarch overseer turned ghoul, with his drowned labourers as skeletons and the three vanished as his zombies.
  related: [npc:ostric]
- id: the-three-nights
  text: Ostric woke a week ago, took Coll, Annet and Brisk on three nights running, and has spent the nights since raising his labourers. From the party's arrival he goes further each night - the first night he walks the river path with his dead (the party may see them), the second he comes to the edge of the village and takes someone unless stopped, and the third he walks into Ambresleigh itself with everything he has, and the village is lost unless the party stands there.
  related: [npc:ostric, faction:the-drowned]
- id: ferryman-glad
  text: The Ferryman of Hask Ford, the Lady's rival downriver, would be glad to see her fade. His Guild sent Merrit Vane to find out whether she is weakening, nothing more.
  related: [npc:merrit-vane, npc:the-lady]
